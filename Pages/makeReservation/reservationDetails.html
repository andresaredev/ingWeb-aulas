<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva de Aulas</title>
    <link rel="stylesheet" href="../../css/makeReservation/details.css" />
  </head>
  <body>
    <nav class="sidebar">
      <img class="umbLogo" src="../../assets/umbLogo.png" />
      <h1 class="logo">Reserva<br />de Aulas</h1>
      <a href="/Pages/home/index.html" class="nav-item active">Inicio</a>
      <a href="/Pages/aboutUs/index.html" class="nav-item">Buscar aula</a>
      <a href="/Pages/makeReservation/" class="nav-item">Crear Reserva</a>
      <button class="btn logOut btn primary" id="logoutButton">
        Cerrar Sesión
      </button>
    </nav>

    <div class="main-content">
      <h2>Crear reserva:</h2>
      <p>
        A continuación, indique la cantidad de estudiantes para la que necesita
        su reserva.
      </p>

      <!-- Formulario -->
      <form id="reservation-form">
        <label for="students"
          >Indique la capacidad total que espera reservar</label
        >
        <input
          type="number"
          id="students"
          name="students"
          placeholder="200 Estudiantes"
          required
        />

        <label for="room">Buscar un aula o área en específico:</label>
        <input type="text" id="room" name="room" placeholder="Auditorio" />

        <!-- Tabla de resultados -->
        <table>
          <thead>
            <tr>
              <th>Aula</th>
              <th>Capacidad</th>
              <th>Horario</th>
              <th>Fecha</th>
              <th>Lugar</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Auditorio</td>
              <td>270 estudiantes</td>
              <td>15:45 - 17:15</td>
              <td>20/05/2022</td>
              <td>Sector Informática</td>
              <td class="available">Disponible</td>
              <td><button type="button" class="btn primary">Añadir</button></td>
            </tr>
          </tbody>
        </table>

        <button type="submit" class="btn primary">Confirmar Reserva</button>
      </form>
    </div>

    <div id="popupContainer"></div>
    <script src="../../js/logOut.js"></script>

    <script type="module">
      // makeReservation.js
      document.addEventListener("DOMContentLoaded", () => {
        const nextButton = document.getElementById("nextButton");

        nextButton.addEventListener("click", () => {
          window.location.href = "./reservationDetails.html";
        });
      });
    </script>
    
  </body>
</html>
