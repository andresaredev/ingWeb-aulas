<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Reserva</title>
    <link rel="stylesheet" href="../../css/makeReservation/reservation.css" />
  </head>
  <body>
    <nav class="sidebar">
      <img class="umbLogo" src="../../assets/umbLogo.png" />
      <h1 class="logo">Reserva<br />de Aulas</h1>
      <a href="/Pages/home/index.html" class="nav-item active">Inicio</a>
      <a href="/Pages/aboutUs/index.html" class="nav-item">Buscar aula</a>
      <a href="/Pages/makeReservation/" class="nav-item">Crear Reserva</a>
      <button class="btn logOut btn primary" id="logoutButton">
        Cerrar Sesión
      </button>
    </nav>

    <div class="main-content">
      <h2>Crear reserva:</h2>
      <h3>LLenado de datos</h3>
      <p>
        Para empezar con la reserva, llene los siguientes campos
        correspondientes.
      </p>

      <!-- Formulario de reserva -->
      <form class="reservation-form">
        <div class="form-group">
          <label>Docente:</label>
          <input type="text" value="Nombre" disabled />
        </div>

        <div class="form-group">
          <label>Añadir Materia:</label>
          <select>
            <option>1</option>
            <option>2</option>
          </select>
        </div>

        <div class="form-group">
          <label>Motivo:</label>
          <select>
            <option>Examen</option>
            <option>Clase</option>
          </select>
        </div>

        <div class="form-group">
          <label>Fecha de reserva:</label>
          <input type="date" />
        </div>

        <div class="form-group">
          <label>Horario:</label>
          <select>
            <option>15:45 - 17:15</option>
            <option>17:30 - 19:00</option>
          </select>
        </div>

        <!-- Botones -->
        <div class="form-buttons">
          <button type="button" class="btn">Volver atrás</button>
          <button type="button" class="btn primary" id="nextButton">
            Siguiente
          </button>
        </div>
      </form>
    </div>

    <div id="popupContainer"></div>
    <script src="../../js/logOut.js"></script>

    <script type="module">
      // makeReservation.js
      document.addEventListener("DOMContentLoaded", () => {
        const nextButton = document.getElementById("nextButton");

        nextButton.addEventListener("click", () => {
          window.location.href = "./reservationDetails.html"; 
        });
      });
    </script>
  </body>
</html>
