<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/login/login.css" />
  </head>
  <body>
    <div class="form-container">
      <a href="/Pages/home/index.html" class="close-button">X</a>
      <!-- <button class="close-button" onclick="cerrarFormulario()">x</button> -->
      <form id="loginForm">
        <h2>¡Hola, inicia sesión para poder separar las aulas!</h2>
        <div class="form-group">
          <label for="codSis">Ingrese correo institucional</label>
          <input
            type="text"
            id="codSis"
            name="codSis"
            placeholder="usuario@docentes.umb.edu.co"
            required
          />
          <small class="error" id="codSisError"></small>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="********"
            required
          />
          <small class="error" id="passwordError"></small>
        </div>
        <div class="form-btn">
          <button type="submit" class="btn-primary">Iniciar sesión</button>

          <a href="/Pages/sign_in/index.html" class="btn-secondary"
            >Registrarse</a
          >
          <!-- <button type="button" class="btn-secondary">Registrarse</button> -->
        </div>

        <a href="#" class="link">Recuperar contraseña</a>
      </form>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const codSisInput = document.getElementById("codSis");
      const passwordInput = document.getElementById("password");
      const codSisError = document.getElementById("codSisError");
      const passwordError = document.getElementById("passwordError");

      // Validación del formulario
      function validarData(event) {
        event.preventDefault(); // Prevenir el comportamiento por defecto del formulario
        let isValid = true;

        // Validar correo institucional
        if (!codSisInput.value.endsWith("@docentes.umb.edu.co")) {
          codSisError.textContent =
            "El correo debe ser institucional (@docentes.umb.edu.co).";
          codSisInput.classList.add("error-border");
          isValid = false;
        } else {
          codSisError.textContent = "";
          codSisInput.classList.remove("error-border");
        }

        // Validar contraseña
        if (passwordInput.value.length < 6) {
          passwordError.textContent =
            "La contraseña debe tener al menos 6 caracteres.";
          passwordInput.classList.add("error-border");
          isValid = false;
        } else {
          passwordError.textContent = "";
          passwordInput.classList.remove("error-border");
        }

        // Si es válido, redirigir
        if (isValid) {
          window.location.replace("/Pages/homeLog/index.html");
        }
      }

      // Asignar el evento submit al formulario
      form.addEventListener("submit", validarData);
    </script>
  </body>
</html>
