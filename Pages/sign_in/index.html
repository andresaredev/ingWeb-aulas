<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link rel="stylesheet" href="/css/sign_in/sign_in.css">
</head>
<body>
  <div class="form-container">
    <a href="/Pages/home/index.html" class="close-button">X</a>
    <form id="signInForm">
      <h2>Regístrese para acceder a todas las funcionalidades</h2>
      <div class="form-group">
        <label for="fullName">Ingrese su nombre</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="Ingrese su nombre" 
          required 
        />
      </div>
      <div class="form-group">
        <label for="codSis">Correo Institucional</label>
        <input 
          type="text" 
          id="codSis" 
          name="codSis" 
          placeholder="usuario@docentes.umb.edu.co" 
          required 
        />
        <small class="error" id="codSisError"></small>
      </div>
      <div class="form-group">
        <label for="phone">Celular</label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          placeholder="32133333333" 
          pattern="[0-9]{10}" 
          required 
        />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Escriba su contraseña" 
          required 
        />
      </div>
      <div class="form-group">
        <label for="repeatPassword">Repita la contraseña</label>
        <input 
          type="password" 
          id="repeatPassword" 
          name="repeatPassword" 
          placeholder="Repita su contraseña" 
          required 
        />
      </div>
      <button type="submit" class="btn-primary">Registrarse</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('signInForm');
    const codSisInput = document.getElementById('codSis');
    const codSisError = document.getElementById('codSisError');

    form.addEventListener('submit', (event) => {
      const codSis = codSisInput.value;

      if (!codSis.endsWith('@docentes.umb.edu.co')) {
        event.preventDefault(); 
        codSisError.textContent = 'El correo debe ser institucional (@docentes.umb.edu.co).';
        codSisInput.classList.add('error-border');
      } else {
        codSisError.textContent = ''; 
        codSisInput.classList.remove('error-border');
      }
    });
  </script>
</body>
</html>
