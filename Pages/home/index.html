<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Aulas</title>
    <link rel="stylesheet" href="../../css/home/home.css">
</head>
<body>
    <nav class="sidebar">
        <img class="umbLogo" src="../../assets/umbLogo.png">
        <h1 class="logo">Reserva<br>de Aulas</h1>
        <a href="/Pages/home/index.html" class="nav-item active">Inicio</a>
        <a href="/Pages/aboutUs/index.html" class="nav-item">Buscar aula</a>
        <a href="/Pages/makeReservation/" class="nav-item">Crear Reserva</a>
        
    </nav>

    <div class="main-content">
        <header class="top-bar">
            <button class="btn">Registrarse</button>
            <button class="btn primary">Iniciar sesión</button>
        </header>

        <section class="content">
            <div class="text-content">
                <h2>¿Qué aula le gustaría <span class="highlight">reservar?</span></h2>
            </div>
            <img src="../../assets/home.png" class="main-image">
        </section>
    </div>

     <!-- Pop-up para cerrar sesión -->
    <div id="logoutPopup" class="popup">
        <div class="popup-content">
            <p>Está a punto de terminar su sesión</p>
            <div class="popup-buttons">
                <button id="cancelButton">Cancelar</button>
                <button id="confirmLogoutButton">Cerrar sesión</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/logOut.js"></script>
</body>
</html>
